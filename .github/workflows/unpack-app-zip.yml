name: App ZIP entpacken

on:
  push:
    branches:
      - main
    paths:
      - "app.zip"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: unpack-app-zip
  cancel-in-progress: false

jobs:
  unpack:
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ZIP prüfen
        run: |
          test -f app.zip || (
            echo "app.zip wurde nicht gefunden."
            exit 1
          )

      - name: ZIP entpacken
        shell: bash
        run: |
          set -euo pipefail

          rm -rf .unpack_tmp
          mkdir -p .unpack_tmp

          unzip -q app.zip -d .unpack_tmp

          # macOS-Metadaten entfernen
          rm -rf .unpack_tmp/__MACOSX
          find .unpack_tmp -name ".DS_Store" -delete || true

          # Prüfen, ob das ZIP genau einen äußeren Ordner enthält
          mapfile -t TOP_ITEMS < <(
            find .unpack_tmp \
              -mindepth 1 \
              -maxdepth 1 \
              -printf '%f\n'
          )

          if [ "${#TOP_ITEMS[@]}" -eq 1 ] && \
             [ -d ".unpack_tmp/${TOP_ITEMS[0]}" ]; then

            SOURCE=".unpack_tmp/${TOP_ITEMS[0]}/"

          else

            SOURCE=".unpack_tmp/"

          fi

          # Dateien ins Repository übernehmen
          rsync -a \
            --exclude='.git/' \
            --exclude='app.zip' \
            "$SOURCE" ./

          # Temporäre Dateien und ZIP entfernen
          rm -rf .unpack_tmp
          rm -f app.zip

      - name: Änderungen committen
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "Keine Änderungen."
            exit 0
          fi

          git commit -m "Update app from uploaded ZIP"
          git push
