<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#305f57"><title>Betreuung - Offline</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f7f7f2;color:#1e2524;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:20px}.card{width:min(440px,100%);background:#fff;border:1px solid #dfe4e1;border-radius:24px;padding:24px;box-shadow:0 18px 45px rgba(27,42,38,.09)}.logo{width:50px;height:50px;border-radius:16px;background:#305f57;color:#fff;display:grid;place-items:center;font-size:24px;font-weight:800}h1{font-size:25px;margin:18px 0 8px}p{color:#68716f;line-height:1.5}button{border:0;background:#305f57;color:#fff;border-radius:14px;padding:12px 16px;font:inherit;font-weight:800}</style></head><body><div class="card"><div class="logo">N</div><h1>Gerade offline</h1><p>Die App konnte noch keine gespeicherte Ansicht laden. Sobald wieder eine Verbindung besteht, einmal öffnen; danach stehen die zuletzt geladenen Daten auch offline lesbar zur Verfügung.</p><button onclick="location.reload()">Erneut versuchen</button></div></body></html>
